name: CI

on:
  push:
    branches: [main, codex/zhinu-activity-groups, codex/zg-rq-02-zhinu]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Use runner work volume for temporary databases
        shell: pwsh
        run: |
          $temporary = Join-Path $env:RUNNER_TEMP 'activity-groups'
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) { "$name=$temporary" >> $env:GITHUB_ENV }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet restore Penghou.Zhinu.slnx

      - run: dotnet build Penghou.Zhinu.slnx -c Release --no-restore

      - run: dotnet format Penghou.Zhinu.slnx --verify-no-changes --no-restore

      - run: dotnet test Penghou.Zhinu.slnx -c Release --no-build --no-restore --logger trx --logger 'console;verbosity=normal' --blame-hang-timeout 5m --blame-hang-dump-type none --results-directory test-results

      - run: dotnet pack Penghou.Zhinu.slnx -c Release --no-build --no-restore -o artifacts -p:RepositoryCommit=${{ github.sha }}

      - name: Verify isolated package closure and legacy binary compatibility
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Directory.Build.props
          $version = [string]$properties.Project.PropertyGroup.Version
          ./eng/Verify-WorkflowPackageClosure.ps1 -ArtifactsDirectory artifacts -PackageVersion $version -OutputDirectory qualification
          ./eng/Verify-LegacyWorkflowConsumer.ps1 -ArtifactsDirectory artifacts -PackageVersion $version -OutputDirectory qualification

      # ZG-RQ-02 RG-01 Stage A: after every qualification check has passed on
      # this exact commit, freeze the release-qualification manifest and upload
      # the qualified package set. The publisher consumes only these artifacts.
      - name: Emit release qualification manifest (ubuntu producer)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          ./eng/New-ReleaseQualificationManifest.ps1 `
            -ArtifactsDirectory artifacts `
            -OutputPath artifacts/release-qualification-manifest.json `
            -Repository "$env:GITHUB_REPOSITORY" `
            -CommitSha "$env:GITHUB_SHA" `
            -WorkflowPath '.github/workflows/ci.yml' `
            -RunId "$env:GITHUB_RUN_ID" `
            -RunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - name: Upload release qualification artifact set (ubuntu producer)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-ubuntu-latest
          path: |
            artifacts/release-qualification-manifest.json
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhinu-qualification-${{ matrix.os }}
          path: |
            test-results/*.trx
            test-results/**/Sequence*.xml
            artifacts/*.nupkg
            artifacts/*.snupkg
            qualification/**/qualification.json
            qualification/**/logs/*.log
