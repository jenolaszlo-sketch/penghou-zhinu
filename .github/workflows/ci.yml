name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Penghou.Zhinu.slnx

      - run: dotnet build Penghou.Zhinu.slnx -c Release --no-restore

      - run: dotnet format Penghou.Zhinu.slnx --verify-no-changes --no-restore

      - run: dotnet test Penghou.Zhinu.slnx -c Release --no-build --no-restore

      - run: dotnet pack Penghou.Zhinu.slnx -c Release --no-build --no-restore -o artifacts
