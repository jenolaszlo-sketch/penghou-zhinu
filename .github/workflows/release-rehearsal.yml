name: Release rehearsal

# ZG-RQ-02 RG-01: nonpublishing hosted rehearsal of the two-stage release
# path. This workflow never contains a NuGet login or push step (structural
# guard below proves it), and it grants no publication credentials. It:
#   1. resolves the exact dispatched commit and its expected version;
#   2. verifies the real qualification run of that commit through the
#      authenticated GitHub API and downloads its artifact set;
#   3. verifies the artifacts against the manifest with the production
#      verifier scripts;
#   4. runs the offline fault-injection matrix (R01, R06-R12, R14, R18)
#      over the real qualified artifacts;
#   5. runs offline API-shape and tag-boundary fault fixtures (R02-R05,
#      R10, R12-R14, R18) through the production downloader;
#   6. proves structurally that push steps exist only behind verification
#      and the protected environment.
#
# Live-API negatives against real historical runs (R02 no-runs and
# old-format artifact-absent, R04 failed, R05 cancelled, R13 wrong-workflow)
# are read-only local evidence recorded in
# docs/evidence/zg-rq-02/local/live-api-negatives.json. They are not repeated
# here because they depend on mutable repository history.

on:
  workflow_dispatch:
  push:
    branches: [codex/zg-rq-02-rehearsal]

permissions:
  contents: read

jobs:
  rehearse:
    name: Verify qualified release path (no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.qualification.outputs.run-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout rehearsal commit
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve expected package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify qualification run of the exact commit
        id: qualification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $result = ./eng/Verify-QualificationRun.ps1 `
            -Repository "$env:GITHUB_REPOSITORY" `
            -CommitSha "$env:GITHUB_SHA" `
            -GitHubToken "$env:GH_TOKEN" `
            -WorkflowFile 'ci.yml' `
            -ExpectedWorkflowPath '.github/workflows/ci.yml' `
            -ArtifactName 'release-qualification-ubuntu-latest' `
            -ManifestName 'release-qualification-manifest.json' `
            -OutputDirectory 'qualified-artifacts' | ConvertFrom-Json
          if ($result.verifiedCommitSha -ne "$env:GITHUB_SHA") {
            throw "Verified run commit does not match the rehearsal commit."
          }
          "run-id=$($result.verifiedRunId)" >> $env:GITHUB_OUTPUT
          "RELEASE-ELIGIBLE: exact commit $env:GITHUB_SHA qualified by run $($result.verifiedRunId); NO PUSH will occur."

      - name: Run offline release rehearsal matrix
        shell: pwsh
        run: |
          $runId = '${{ steps.qualification.outputs.run-id }}'
          if ($runId -notmatch '^\d+$') { throw "Untrusted run id: $runId" }
          ./eng/Invoke-ReleaseRehearsal.ps1 `
            -QualifiedArtifactsDirectory 'qualified-artifacts' `
            -ManifestPath 'qualified-artifacts/release-qualification-manifest.json' `
            -Repository "$env:GITHUB_REPOSITORY" `
            -CommitSha "$env:GITHUB_SHA" `
            -RunId ([long]$runId) `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputDirectory 'artifacts/rehearsal-matrix'

      - name: Offline API and tag boundary fault fixtures
        shell: pwsh
        run: ./eng/Test-QualificationBoundary.ps1 -QualifiedArtifactsDirectory qualified-artifacts -OutputDirectory artifacts/api-boundaries

      - name: Upload verified handoff set
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-packages
          path: |
            qualified-artifacts/release-qualification-manifest.json
            qualified-artifacts/*.nupkg
            qualified-artifacts/*.snupkg
          if-no-files-found: error

      - name: Retain rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal-evidence
          path: |
            artifacts/rehearsal-matrix/rehearsal-matrix.json
            artifacts/api-boundaries/qualification-boundary.json
            qualified-artifacts/release-qualification-manifest.json
          if-no-files-found: warn

  handoff:
    name: Reverify publication handoff without credentials
    needs: rehearse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-packages
          path: verified-artifacts
      - uses: actions/checkout@v6
        with:
          path: verifier-source
          persist-credentials: false
      - name: Verify the same final artifact contract as the publisher
        shell: pwsh
        env:
          QUALIFICATION_RUN: ${{ needs.rehearse.outputs.run-id }}
          PACKAGE_VERSION: ${{ needs.rehearse.outputs.version }}
        run: |
          ./verifier-source/eng/Verify-ReleaseArtifacts.ps1 `
            -ManifestPath verified-artifacts/release-qualification-manifest.json `
            -ArtifactsDirectory verified-artifacts `
            -ExpectedRepository "$env:GITHUB_REPOSITORY" `
            -ExpectedCommitSha "$env:GITHUB_SHA" `
            -ExpectedWorkflowPath '.github/workflows/ci.yml' `
            -ExpectedRunId ([long]$env:QUALIFICATION_RUN) `
            -ExpectedVersion "$env:PACKAGE_VERSION"

  authorization-probe:
    name: Nonpublishing environment checkpoint
    needs: handoff
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
    steps:
      - run: echo 'Manual checkpoint reached. No credentials requested; publication remains unauthorized.'
