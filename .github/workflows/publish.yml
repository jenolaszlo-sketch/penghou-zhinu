name: Publish to NuGet

# ZG-RQ-02 RG-01: two-stage release. Stage 1 (verify) resolves the exact
# publication commit (tag ref or dispatch ref), locates the successful
# qualification run of THIS commit of the CI workflow through the
# authenticated GitHub API, downloads its uploaded qualification artifact
# set, and verifies the manifest, package identities, hashes and dependency
# pins. Stage 2 (publish) consumes only the verified artifacts and runs only
# after Stage 1 succeeds and the protected `nuget` environment approval is
# granted. The workflow never packs; it publishes exactly the artifacts
# produced by the qualifying CI run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact-commit qualification and artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      package-version: ${{ steps.version.outputs.version }}
      run-id: ${{ steps.qualification.outputs.run-id }}
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@v6

      - name: Resolve expected package version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          ./eng/Verify-ReleaseRef.ps1 -Version $version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify qualification run of the exact commit and download artifacts
        id: qualification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $result = ./eng/Verify-QualificationRun.ps1 `
            -Repository "$env:GITHUB_REPOSITORY" `
            -CommitSha "$env:GITHUB_SHA" `
            -GitHubToken "$env:GH_TOKEN" `
            -WorkflowFile 'ci.yml' `
            -ExpectedWorkflowPath '.github/workflows/ci.yml' `
            -ArtifactName 'release-qualification-ubuntu-latest' `
            -ManifestName 'release-qualification-manifest.json' `
            -OutputDirectory 'qualified-artifacts' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "run-id=$($result.verifiedRunId)" >> $env:GITHUB_OUTPUT
          "verified-sha=$($result.verifiedCommitSha)" >> $env:GITHUB_OUTPUT
          if ($result.verifiedCommitSha -ne "$env:GITHUB_SHA") {
            throw "Verified run commit does not match the publication commit."
          }

      - name: Verify release artifacts against the qualified manifest
        shell: pwsh
        run: |
          $runId = '${{ steps.qualification.outputs.run-id }}'
          if ($runId -notmatch '^\d+$') { throw "Untrusted run id: $runId" }
          ./eng/Verify-ReleaseArtifacts.ps1 `
            -ManifestPath 'qualified-artifacts/release-qualification-manifest.json' `
            -ArtifactsDirectory 'qualified-artifacts' `
            -ExpectedRepository "$env:GITHUB_REPOSITORY" `
            -ExpectedCommitSha "$env:GITHUB_SHA" `
            -ExpectedWorkflowPath '.github/workflows/ci.yml' `
            -ExpectedRunId ([long]$runId) `
            -ExpectedVersion '${{ steps.version.outputs.version }}'

      - name: Upload verified release set
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-packages
          path: |
            qualified-artifacts/release-qualification-manifest.json
            qualified-artifacts/*.nupkg
            qualified-artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push verified artifacts (protected environment)
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download verified release set
        uses: actions/download-artifact@v4
        with:
          name: verified-release-packages
          path: verified-artifacts

      - uses: actions/checkout@v6
        with:
          path: verifier-source
          persist-credentials: false

      - name: Verify downloaded manifest and every archive before credentials
        shell: pwsh
        env:
          QUALIFICATION_RUN: ${{ needs.verify.outputs.run-id }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.package-version }}
        run: |
          ./verifier-source/eng/Verify-ReleaseArtifacts.ps1 `
            -ManifestPath verified-artifacts/release-qualification-manifest.json `
            -ArtifactsDirectory verified-artifacts `
            -ExpectedRepository "$env:GITHUB_REPOSITORY" `
            -ExpectedCommitSha "$env:GITHUB_SHA" `
            -ExpectedWorkflowPath '.github/workflows/ci.yml' `
            -ExpectedRunId ([long]$env:QUALIFICATION_RUN) `
            -ExpectedVersion "$env:PACKAGE_VERSION"

      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet
        run: >
          dotnet nuget push ./verified-artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Push symbols to NuGet
        run: >
          dotnet nuget push ./verified-artifacts/*.snupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
